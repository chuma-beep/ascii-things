<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-things — dither element</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070809;
        --line: #24262a;
        --ink: #ece8df;
        --muted: #8d8a82;
        --orange: #ff7a1a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(980px, calc(100vw - 40px)); margin: 0 auto; padding: 48px 0 64px; }
      .eyebrow { color: var(--orange); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.05em; }
      p { max-width: 620px; color: var(--muted); font-size: 12px; line-height: 1.7; }
      a { color: var(--orange); }
      .field { margin-top: 28px; border: 1px solid var(--line); background: #050607; }
      ascii-dither { height: 360px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Custom element</p>
      <h1>&lt;ascii-dither&gt;</h1>
      <p>
        The same dither field without React. Import the element entry once, then use the tag.
        The host owns the height. <a href="./index.html">Open the React version</a>.
      </p>
      <div class="field">
        <ascii-dither
          text="ASCII-THINGS"
          matrix="bayer4"
          density="0.1"
          label="ASCII-THINGS dither field"
        ></ascii-dither>
      </div>
    </main>
    <script type="module" src="/dist/dither-element.js"></script>
  </body>
</html>
