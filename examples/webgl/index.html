<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-things — WebGL ASCII surface</title>
    <meta
      name="description"
      content="A WebGL ASCII surface with a glyph atlas, text mask, scan band, and pointer response, plus a 2D fallback."
    />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070809;
        --panel: #0b0d0f;
        --line: #24262a;
        --ink: #ece8df;
        --muted: #8d8a82;
        --orange: #ff7a1a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(1080px, calc(100vw - 40px)); margin: 0 auto; padding: 48px 0 72px; }
      .eyebrow { color: var(--orange); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.05em; }
      p { max-width: 640px; color: var(--muted); font-size: 12px; line-height: 1.7; }
      a { color: var(--orange); }
      .field { margin: 28px 0 18px; border: 1px solid var(--line); background: #050607; }
      .controls { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 12px 16px; align-items: end; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
      input, select, button {
        width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 0;
        background: var(--panel); color: var(--ink); font: inherit; font-size: 11px; padding: 7px 9px;
      }
      input[type="range"] { padding: 0; accent-color: var(--orange); }
      button { cursor: pointer; }
      button:hover { border-color: var(--orange); color: var(--orange); }
      button[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }
      .row { display: flex; gap: 8px; }
      @media (max-width: 820px) { .controls { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Design component · WebGL</p>
      <h1>ASCII surface</h1>
      <p>
        A living glyph field rendered in a WebGL shader. A generated glyph atlas, a text mask,
        an accent scan, and pointer response, with a 2D glyph fallback when WebGL is unavailable.
        <a href="./element.html">Open the custom element version</a>.
      </p>
      <div id="root"></div>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
