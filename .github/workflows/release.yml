name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required repository secret:
#   NPM_TOKEN - npm automation token with publish access to the `ascii-things`
#               package. Provenance is requested through id-token: write and
#               NPM_CONFIG_PROVENANCE below; GitHub's OIDC token is not a
#               replacement for the npm auth token.
# GITHUB_TOKEN is provided by Actions and needs the write permissions below to
# open/update the version PR and create GitHub releases.

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
