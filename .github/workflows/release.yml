name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing uses npm Trusted Publishing (OIDC), so this repository stores no
# long-lived npm publish token. The package must have a trusted publisher on
# npmjs.com with these exact values:
#   Organization or user: chuma-beep
#   Repository:           ascii-things
#   Workflow filename:    release.yml
#   Environment name:     (blank)
#   Allowed actions:      npm publish (and npm dist-tag if needed)
# GITHUB_TOKEN is provided by Actions and needs the write permissions below to
# open/update the version PR and create GitHub releases.

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Block prerelease publishing
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Version or publish
    needs: guard
    if: needs.guard.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1. The npm bundled with Node
      # can lag behind, so install a current 11.x explicitly.
      - name: Upgrade npm for trusted publishing
        run: npm install --global 'npm@^11.21.0'

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
